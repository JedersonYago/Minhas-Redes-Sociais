<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta 
        name="viewport" 
        content="width=device-width, initial-scale=1.0"
    >

    <title>Minhas Redes Sociais</title>

    <link rel="stylesheet" href="style.css">

    <!-- Font Awesome -->
    <link 
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    >

</head>


<body>

    <main class="container">

        <!-- PERFIL -->

        <section class="perfil">

            <img 
                src="img/perfil.jpg" 
                alt="Foto de perfil"
                class="foto-perfil"
            >

            <h1>Yago Rêgo</h1>

            <p>
                Desenvolvedor Front-end 🚀
            </p>

        </section>


        <!-- REDES SOCIAIS -->

        <section class="redes">

            <a 
                href="https://www.instagram.com/yago.rego"
                target="_blank"
                rel="noopener noreferrer"
                class="link instagram"
            >

                <i class="fa-brands fa-instagram"></i>

                <span>Instagram</span>

                <i class="fa-solid fa-arrow-right"></i>

            </a>


            <a 
                href="https://www.facebook.com/"
                target="_blank"
                rel="noopener noreferrer"
                class="link facebook"
            >

                <i class="fa-brands fa-facebook"></i>

                <span>Facebook</span>

                <i class="fa-solid fa-arrow-right"></i>

            </a>


            <a 
                href="https://x.com/"
                target="_blank"
                rel="noopener noreferrer"
                class="link twitter"
            >

                <i class="fa-brands fa-x-twitter"></i>

                <span>Twitter / X</span>

                <i class="fa-solid fa-arrow-right"></i>

            </a>


            <a 
                href="https://www.whatsapp.com/"
                target="_blank"
                rel="noopener noreferrer"
                class="link whatsapp"
            >

                <i class="fa-brands fa-whatsapp"></i>

                <span>WhatsApp</span>

                <i class="fa-solid fa-arrow-right"></i>

            </a>


            <a 
                href="https://github.com/"
                target="_blank"
                rel="noopener noreferrer"
                class="link github"
            >

                <i class="fa-brands fa-github"></i>

                <span>GitHub</span>

                <i class="fa-solid fa-arrow-right"></i>

            </a>


            <a 
                href="https://www.linkedin.com/"
                target="_blank"
                rel="noopener noreferrer"
                class="link linkedin"
            >

                <i class="fa-brands fa-linkedin"></i>

                <span>LinkedIn</span>

                <i class="fa-solid fa-arrow-right"></i>

            </a>

        </section>


        <!-- RODAPÉ -->

        <footer>

            <p>
                © 2026 • Feito por mim 🚀
            </p>

        </footer>

    </main>

</body>

</html>
